name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ '${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}' == 'true' ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  rust:
    needs: [trust-check]
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    env:
      STELLA_SOURCE_LINT_REV: a1bd81740ecb4b66999f56d1716e1190c4e7272f
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: source-lint-cache
        with:
          path: ${{ runner.temp }}/stella-source-lint/bin
          key: stella-source-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.STELLA_SOURCE_LINT_REV }}
      - name: Install stable Rust source checker
        if: steps.source-lint-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/stella/tooling
          --rev "$STELLA_SOURCE_LINT_REV" --locked
          --root "$RUNNER_TEMP/stella-source-lint" stella_source_lint
      - run: echo "$RUNNER_TEMP/stella-source-lint/bin" >> "$GITHUB_PATH"
      - run: cargo stella-lint .

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package
        run: cargo package --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: License audit
        run: |
          cargo install cargo-deny --locked
          cargo deny check bans licenses sources

      - name: Advisory audit
        uses: stella/.github/.github/actions/cargo-deny-advisories@12eb83b8c6bd42a0bead73d9c6bc30b4caad6433
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          manifest-path: Cargo.toml
          config: deny.toml
          lockfile: Cargo.lock

  integration-real:
    needs: [trust-check]
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Validate workflow trust contracts
        run: node --test scripts/ci-trust.test.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen@12.1.5

      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Real tool integration tests
        run: cargo test --test integration_real -- --ignored
        env:
          PROVENANCE_SYFT: ${{ steps.syft.outputs.cmd }}

  ci-result:
    if: always()
    needs: [trust-check, rust, integration-real]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every validation job
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUST_RESULT: ${{ needs.trust-check.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          INTEGRATION_RESULT: ${{ needs.integration-real.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$TRUST_RESULT" = success
          else
            # The trust check is pull-request-only.
            case "$TRUST_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          fi
