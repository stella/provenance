[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
]

# encoding_rs 0.8.42 includes WHATWG tables under BSD-3-Clause.
# The exact notice is retained in THIRD_PARTY_NOTICES, shipped in every archive.
[[licenses.exceptions]]
name = "encoding_rs"
version = "=0.8.42"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
