name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          artifact_dir="dist/provenance-${VERSION}-${TARGET}"
          mkdir -p "$artifact_dir"
          cp "target/${TARGET}/release/provenance" "$artifact_dir/"
          cp README.md LICENSE "$artifact_dir/"
          tar -C dist -czf "dist/provenance-${VERSION}-${TARGET}.${ARCHIVE_EXT}" "$(basename "$artifact_dir")"
          rm -rf "$artifact_dir"

      - name: Package archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          $artifactDir = "dist/provenance-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item "target/$env:TARGET/release/provenance.exe" "$artifactDir/provenance.exe"
          Copy-Item README.md "$artifactDir/README.md"
          Copy-Item LICENSE "$artifactDir/LICENSE"
          Compress-Archive -Path "$artifactDir/*" -DestinationPath "dist/provenance-$env:VERSION-$env:TARGET.zip"
          Remove-Item -Recurse -Force $artifactDir

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-${{ matrix.target }}
          path: dist/provenance-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum provenance-* > "provenance-${VERSION}-checksums.txt"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag --repo "$REPOSITORY"
          fi
